# WaterCRM Nginx Configuration for Plesk
# nginx (port 80/443) → Apache (port 7080/7443)
#
# En Plesk, nginx actúa como proxy reverso a Apache
# Este archivo debe colocarse en:
# /etc/nginx/sites-enabled/crm-prueba.test.conf
# o en el directorio de configuración de nginx según tu sistema

# HTTP Server Block - Sin HTTPS
server {
    listen 80;
    listen [::]:80;

    # Acepta todas las peticiones (para multi-tenancy)
    server_name 217.154.186.92 crm-prueba.test *.crm-prueba.test;

    # Logging
    access_log /var/log/nginx/watercrm-access.log;
    error_log /var/log/nginx/watercrm-error.log;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Tamaño máximo de subida
    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Proxy a Apache en puerto 7080
    location / {
        proxy_pass http://127.0.0.1:7080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Archivos estáticos - servir directamente desde nginx (opcional, mejor rendimiento)
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        root /var/www/vhosts/crm-prueba.test/public/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Si el archivo no existe, pasar a Apache
        try_files $uri @apache;
    }

    # Fallback a Apache
    location @apache {
        proxy_pass http://127.0.0.1:7080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

